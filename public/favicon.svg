<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEEF2"/>
      <stop offset="50%" stop-color="#F5F0FF"/>
      <stop offset="100%" stop-color="#EBD9E8"/>
    </linearGradient>
    <linearGradient id="dGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D77AB6"/>
      <stop offset="50%" stop-color="#9276C9"/>
      <stop offset="100%" stop-color="#51436F"/>
    </linearGradient>
    <linearGradient id="petalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFAFCB"/>
      <stop offset="100%" stop-color="#E9A6C4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#EBD9E8" stroke-width="2"/>

  <!-- Stylized Anime 'D' -->
  <path d="M20 15 H32 C41 15 48 22 48 32 C48 42 41 49 32 49 H20 Z" fill="none" stroke="url(#dGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="20" y1="15" x2="20" y2="49" stroke="url(#dGrad)" stroke-width="6.5" stroke-linecap="round"/>

  <!-- Sakura Petal on Top Right of D -->
  <path d="M44 14 C41 10 48 6 51 9 C54 12 50 19 44 14 Z" fill="url(#petalGrad)" filter="url(#glow)"/>
  <circle cx="50" cy="8" r="1.5" fill="#FFFFFF"/>

  <!-- Tiny Sparkle Star -->
  <path d="M47 38 L48.5 41 L51.5 42.5 L48.5 44 L47 47 L45.5 44 L42.5 42.5 L45.5 41 Z" fill="#FFAFCB"/>

  <!-- Inner Sparkle inside D -->
  <circle cx="28" cy="27" r="1.8" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="34" cy="35" r="1.2" fill="#FFFFFF" opacity="0.7"/>
</svg>
